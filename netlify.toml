# PBT (Pushback Training) — https://github.com/RethinkRealityAI/PBT
# In Netlify: Site configuration → Environment variables, set at least:
#   GEMINI_API_KEY                  — required; read ONLY by Netlify Functions
#                                    (netlify/functions/ai-*). It is never
#                                    compiled into a browser bundle — the
#                                    bundle gate (npm run check:bundle) fails
#                                    the build if a key-shaped string appears
#                                    in dist/.
#   VITE_SUPABASE_URL              — required for cloud sync + admin dashboard
#   VITE_SUPABASE_PUBLISHABLE_KEY  — required (anon key, browser-side)
#   SUPABASE_SERVICE_ROLE_KEY      — required by Netlify Functions only;
#                                    never exposed to the client
#
# Local development: AI features need the functions, so run `netlify dev`
# (which starts Vite and serves /.netlify/functions/*) rather than `vite`
# alone.
#
# `npm ci` uses package-lock.json for reproducible Netlify builds.

[build]
  command   = "npm ci && npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Local `netlify dev`: Vite is pinned to 3006 in vite.config.ts; without this
# the CLI waits on Vite's default 5173 and times out.
[dev]
  targetPort = 3006

# Admin SPA fallback — /admin and /admin/anything serves admin.html.
# Must come before the global SPA fallback so it wins.
[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200
[[redirects]]
  from   = "/admin/*"
  to     = "/admin.html"
  status = 200

# Consumer SPA fallback — every other route serves index.html.
# Netlify Functions (under /.netlify/functions/*) are not rewritten.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN (not DENY) so the admin dashboard's same-origin preview
    # iframes — the Scenario Builder "Test in app" panel and the Preview
    # screen, which embed the consumer at /?pbt_preview=1 — can render.
    # Third-party framing (clickjacking) is still blocked.
    X-Frame-Options         = "SAMEORIGIN"
    Content-Security-Policy  = "frame-ancestors 'self'"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
